<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just me, my vibe, and a little sunshine. ☀️💕</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #eef2f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 25px 15px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .post {
      background: #fff;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    .cover {
      position: relative;
    }

    .cover img {
      width: 100%;
      display: block;
    }

    /* Style Iklan Banner */
    .banner-ad {
      width: 100%;
      text-align: center;
      background-color: #f9f9f9;
      padding: 10px 0;
      border-bottom: 1px solid #ececec;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .content {
      padding: 18px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      color: #222;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 15px;
      color: #555;
      margin-bottom: 18px;
    }

    /* Tampilan tombol dibuat lebih jelas seperti tombol utama */
    .link {
      display: block;
      text-decoration: none;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
      background-color: #229ED9;
      text-align: center;
      padding: 14px 0;
      border-radius: 10px;
      transition: background-color .2s, transform .1s;
    }

    .link:hover {
      background-color: #1a82b3;
    }

    .footer {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="post">

      <div class="cover">
        <img src="https://cdn.aceimg.com/H54H20Mrx.png" alt="Cover Video" loading="lazy">
      </div>

      <div class="content">

        <div class="title">
          🎥 Video
        </div>

        <div class="subtitle">
          Watch below 👇👇👇
        </div>

        <!-- Hanya 1 Tombol Utama -->
        <a class="link" href="https://x-hubb.github.io/L0oksmn3/" target="_blank" rel="noopener noreferrer">
          ▶️ Watch Full Video
        </a>

        <div class="footer">
          ❤️ HD Quality • Fast Loading
        </div>

      </div> <!-- Penutup .content -->

    </div> <!-- Penutup .post -->
  </div> <!-- Penutup .container -->
